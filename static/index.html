<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE WAR ROOM - Chat</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="chat-container">
    <header class="chat-header">
      <div class="header-left">
        <span class="mark">W<span>R</span></span>
        <div>THE WAR ROOM</div>
      </div>
      <div id="provider-status" class="provider-status">
        <span id="status-omlx" class="status-indicator">● oMLX</span>
        <span id="status-claude" class="status-indicator">● Claude</span>
        <span id="status-codex" class="status-indicator">● Codex</span>
      </div>
    </header>

    <div id="notice" role="status" hidden class="notice"></div>

    <div class="chat-messages" id="chat-messages" aria-live="polite">
      <div class="system-message">
        <p>THE WAR ROOM</p>
        <p>Type a prompt and press Enter. Use natural language to route to specific providers.</p>
        <p style="font-size: 0.9em; margin-top: 1em; opacity: 0.7;">Examples:</p>
        <p style="font-size: 0.9em; opacity: 0.7; margin: 0;">• "use claude" / "use omlx" / "use codex"</p>
        <p style="font-size: 0.9em; opacity: 0.7; margin: 0;">• Just ask normally for auto-routing</p>
      </div>
    </div>

    <form id="chat-form" class="chat-input-form">
      <div class="input-toolbar">
        <select id="route" class="route-select">
          <option value="auto">Auto</option>
          <option value="claude-only">Claude</option>
          <option value="codex-only">Codex</option>
          <option value="omlx-only">Local (oMLX)</option>
          <option value="claude-omlx">Claude → Local</option>
          <option value="codex-omlx">Codex → Local</option>
        </select>
        <label class="tools-checkbox">
          <input id="tools" type="checkbox" checked>
          Tools
        </label>
      </div>
      <textarea
        id="prompt"
        class="chat-input"
        placeholder="Type your message... Press Enter to send, Shift+Enter for new line"
        maxlength="12000"
        rows="1"
      ></textarea>
    </form>

    <footer class="chat-footer">
      Local controller · Real MLX adapters · Press Enter to submit
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
